[tool.poetry]
name = "origin_of_species_rag"
version = "0.1.0"
description = "A RAG Project for answering questions about the \"Origin of Species\" book"
authors = ["Matheus Lenke <matheuslenke@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.44.1"
langchain = "^0.3.24"
python-dotenv = "^1.1.0"
pydantic = "^2.11.3"
langchain-google-vertexai = "^2.0.21"
chromadb = "^0.5.3"
langchain-chroma = "0.2.0"
langchain-google-genai = "^2.1.3"
nltk = "^3.9.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.7"
poethepoet = "^0.34.0"

[tool.poetry.scripts]
start = "src.origin_of_species_rag:main"

[tool.poe.tasks]
lint = "ruff check ."
lint-fix = "ruff format ."

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
